<div class="bg-white shadow rounded-lg p-4 sm:p-6 xl:p-8">
  <!-- Encabezado con título y botón "Agregar Actividad" -->
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-xl leading-none font-bold text-gray-900">Estadística de las Actividades</h3>
    <button [routerLink]="['/add-activity']" class="bg-green-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-600 transition duration-300">
      + Agregar Actividad
    </button>
    
  </div>
  

  <div class="block w-full overflow-x-auto">
    <table class="items-center w-full bg-transparent border-collapse">
      <thead>
        <tr>
          <th
            class="px-4 bg-gray-50 text-gray-700 align-middle py-3 text-xs font-semibold text-left uppercase border-l-0 border-r-0 whitespace-nowrap">
            Actividades</th>
          <th
            class="px-4 bg-gray-50 text-gray-700 align-middle py-3 text-xs font-semibold text-left uppercase border-l-0 border-r-0 whitespace-nowrap">
            Estudiantes</th>
          <th
            class="px-4 bg-gray-50 text-gray-700 align-middle py-3 text-xs font-semibold text-left uppercase border-l-0 border-r-0 whitespace-nowrap min-w-140-px">
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr class="text-gray-500">
          <th class="border-t-0 px-4 align-middle text-sm font-normal whitespace-nowrap p-4 text-left">Ajedrez</th>
          <td class="border-t-0 px-4 align-middle text-xs font-medium text-gray-900 whitespace-nowrap p-4">5,649</td>
          <td class="border-t-0 px-4 align-middle text-xs whitespace-nowrap p-4">
            <div class="flex items-center">
              <span class="mr-2 text-xs font-medium">30%</span>
              <div class="relative w-full">
                <div class="w-full bg-gray-200 rounded-sm h-2">
                  <div class="bg-cyan-600 h-2 rounded-sm" style="width: 30%"></div>
                </div>
              </div>
            </div>
          </td>
        </tr>
        <tr class="text-gray-500">
          <th class="border-t-0 px-4 align-middle text-sm font-normal whitespace-nowrap p-4 text-left">Futbol</th>
          <td class="border-t-0 px-4 align-middle text-xs font-medium text-gray-900 whitespace-nowrap p-4">4,025</td>
          <td class="border-t-0 px-4 align-middle text-xs whitespace-nowrap p-4">
            <div class="flex items-center">
              <span class="mr-2 text-xs font-medium">24%</span>
              <div class="relative w-full">
                <div class="w-full bg-gray-200 rounded-sm h-2">
                  <div class="bg-orange-300 h-2 rounded-sm" style="width: 24%"></div>
                </div>
              </div>
            </div>
          </td>
        </tr>
        <tr class="text-gray-500">
          <th class="border-t-0 px-4 align-middle text-sm font-normal whitespace-nowrap p-4 text-left">Danza</th>
          <td class="border-t-0 px-4 align-middle text-xs font-medium text-gray-900 whitespace-nowrap p-4">3,105</td>
          <td class="border-t-0 px-4 align-middle text-xs whitespace-nowrap p-4">
            <div class="flex items-center">
              <span class="mr-2 text-xs font-medium">18%</span>
              <div class="relative w-full">
                <div class="w-full bg-gray-200 rounded-sm h-2">
                  <div class="bg-teal-400 h-2 rounded-sm" style="width: 18%"></div>
                </div>
              </div>
            </div>
          </td>
        </tr>
        <tr class="text-gray-500">
          <th class="border-t-0 px-4 align-middle text-sm font-normal whitespace-nowrap p-4 text-left">Taekwondo</th>
          <td class="border-t-0 px-4 align-middle text-xs font-medium text-gray-900 whitespace-nowrap p-4">1,251</td>
          <td class="border-t-0 px-4 align-middle text-xs whitespace-nowrap p-4">
            <div class="flex items-center">
              <span class="mr-2 text-xs font-medium">12%</span>
              <div class="relative w-full">
                <div class="w-full bg-gray-200 rounded-sm h-2">
                  <div class="bg-pink-600 h-2 rounded-sm" style="width: 12%"></div>
                </div>
              </div>
            </div>
          </td>
        </tr>
        <tr class="text-gray-500">
          <th class="border-t-0 px-4 align-middle text-sm font-normal whitespace-nowrap p-4 text-left">Canto</th>
          <td class="border-t-0 px-4 align-middle text-xs font-medium text-gray-900 whitespace-nowrap p-4">734</td>
          <td class="border-t-0 px-4 align-middle text-xs whitespace-nowrap p-4">
            <div class="flex items-center">
              <span class="mr-2 text-xs font-medium">9%</span>
              <div class="relative w-full">
                <div class="w-full bg-gray-200 rounded-sm h-2">
                  <div class="bg-indigo-600 h-2 rounded-sm" style="width: 9%"></div>
                </div>
              </div>
            </div>
          </td>
        </tr>
        <tr class="text-gray-500">
          <th class="border-t-0 align-middle text-sm font-normal whitespace-nowrap p-4 pb-0 text-left">Actuación</th>
          <td class="border-t-0 align-middle text-xs font-medium text-gray-900 whitespace-nowrap p-4 pb-0">456</td>
          <td class="border-t-0 align-middle text-xs whitespace-nowrap p-4 pb-0">
            <div class="flex items-center">
              <span class="mr-2 text-xs font-medium">7%</span>
              <div class="relative w-full">
                <div class="w-full bg-gray-200 rounded-sm h-2">
                  <div class="bg-purple-500 h-2 rounded-sm" style="width: 7%"></div>
                </div>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
